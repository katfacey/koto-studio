name: Windows self-contained setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'backend/**'
      - 'models/separation/**'
      - '*.cmd'
      - 'frontend/**'
      - '.github/workflows/windows-bootstrap.yml'
permissions:
  contents: read
jobs:
  core-without-system-tools:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: KOTO Studio
    steps:
      - uses: actions/checkout@v4
        with:
          path: KOTO Studio
      - name: Parse all installers with Windows PowerShell
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\check-installers.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap with only Windows system executables on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify app-owned runtimes and run the HTTP/media suite
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          & ".\runtime\uv\uv.exe" --no-config pip install --python ".\.venv\Scripts\python.exe" -r backend\requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\.venv\Scripts\python.exe" -c "import sys; from pathlib import Path; sys.path.insert(0,'backend'); from koto.runtime import executable; root=Path.cwd(); assert Path(sys.base_prefix).is_relative_to(root/'runtime'/'python'); assert Path(executable('ffmpeg')).is_relative_to(root/'runtime'); assert Path(executable('ffprobe')).is_relative_to(root/'runtime')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\.venv\Scripts\python.exe" -m unittest discover -s backend\tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start the actual server with app-owned executables
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          $StudioRoot = (Get-Location).Path
          $Server = Start-Process -FilePath "$StudioRoot\.venv\Scripts\python.exe" -ArgumentList 'scripts\serve.py' -PassThru -RedirectStandardOutput "$StudioRoot\runtime\server.stdout.log" -RedirectStandardError "$StudioRoot\runtime\server.stderr.log"
          try {
            $Ready = $false
            for ($Attempt = 0; $Attempt -lt 60; $Attempt++) {
              if ($Server.HasExited) { throw "Server exited: $(Get-Content runtime\server.stderr.log -Raw)" }
              try {
                $Health = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2
                if ($Health.version -eq '0.3.0' -and $Health.ffmpeg -and $Health.ffprobe) { $Ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $Ready) { throw 'Managed server did not become ready' }
            $Page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
            if (-not $Page.Content.Contains('KOTO Studio')) { throw 'Built editor was not served' }
          } finally { if (-not $Server.HasExited) { Stop-Process -Id $Server.Id -Force } }
      - name: Reinstall the standalone core and preserve project data
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          New-Item -ItemType Directory -Force -Path data | Out-Null
          Set-Content -LiteralPath data\preserve.txt -Value 'preserve-project-data'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content data\preserve.txt).Trim() -ne 'preserve-project-data') { throw 'Reinstall overwrote data' }
          if (-not (Test-Path runtime\installed.json)) { throw 'Standalone runtime receipt is missing' }
          if (-not (Test-Path frontend\dist\index.html)) { throw 'Built editor is missing' }
      - name: Install Piper with Windows PowerShell and synthesize real speech
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile piper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\.venv\Scripts\python.exe" scripts\check_piper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repair a Piper environment pointing at a moved installation
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          Set-Content -LiteralPath .workers\piper\pyvenv.cfg -Value 'home = F:\old-koto\runtime\python\cpython'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile piper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\.venv\Scripts\python.exe" scripts\check_piper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test timeline editing, track controls and voice selection in Chromium
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path (Get-Location).Path 'runtime\cache\playwright'
          & ".\runtime\uv\uv.exe" --no-config pip install --python ".\.venv\Scripts\python.exe" -r scripts\requirements-ui-checks.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\.venv\Scripts\python.exe" -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\.venv\Scripts\python.exe" scripts\check_editor_browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-editor-screenshot
          path: |
            KOTO Studio/runtime/validation/koto-editor.png
            KOTO Studio/runtime/validation/koto-separation.png
            KOTO Studio/runtime/validation/koto-voice-library.png

  reference-voice-worker:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: KOTO Reference Studio
    steps:
      - uses: actions/checkout@v4
        with:
          path: KOTO Reference Studio
      - name: Install app-owned Piper and XTTS with Windows system-only PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile piper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile xtts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate real reference-conditioned English on CPU
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          & ".\.venv\Scripts\python.exe" scripts\check_reference_voice.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  separation-worker:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: KOTO Separation Studio
    steps:
      - uses: actions/checkout@v4
        with:
          path: KOTO Separation Studio
      - name: Install app-owned Piper and UVR-style worker with system-only PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile piper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile separator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\runtime\uv\uv.exe" --no-config pip install --python ".\.venv\Scripts\python.exe" -r backend\requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download models and run real MDX VR and BS-RoFormer preview/full API jobs
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          & ".\.venv\Scripts\python.exe" scripts\check_separation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-separation-validation
          path: KOTO Separation Studio/runtime/validation/separation-validation.json

  qwen-voice-worker:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: KOTO Qwen Studio
    steps:
      - uses: actions/checkout@v4
        with:
          path: KOTO Qwen Studio
      - name: Install private Qwen Base VoiceDesign and Piper workers
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile piper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Profile qwen-design
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual reference batch design audition and design-then-clone
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          & ".\.venv\Scripts\python.exe" scripts\check_qwen.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
