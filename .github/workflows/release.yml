name: Publish 0.3.0 alpha release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: koto-release-0.3.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require passing Windows validation for this exact snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GH_REPO']
          endpoint = f'repos/{repo}/actions/workflows/windows-bootstrap.yml/runs?head_sha={sha}&event=push&per_page=20'
          deadline = time.monotonic() + 45 * 60
          while time.monotonic() < deadline:
              response = subprocess.run(['gh', 'api', endpoint], check=True, capture_output=True, text=True)
              runs = json.loads(response.stdout)['workflow_runs']
              runs = [run for run in runs if run['head_sha'] == sha]
              if runs:
                  run = max(runs, key=lambda item: item['id'])
                  print(f"Windows validation {run['id']}: {run['status']} / {run['conclusion']}", flush=True)
                  if run['status'] == 'completed':
                      if run['conclusion'] != 'success':
                          raise SystemExit(f"Release blocked: Windows validation did not pass: {run['html_url']}")
                      break
              else:
                  print('Waiting for Windows validation to start', flush=True)
              time.sleep(20)
          else:
              raise SystemExit('Release blocked: Windows validation timed out or was not triggered')
          PY
      - name: Package and verify the standalone source ZIP
        run: |
          python scripts/package_release.py
          sha256sum ../KOTO-Studio-v0.3.0.zip
      - name: Publish alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$(dirname "$GITHUB_WORKSPACE")/KOTO-Studio-v0.3.0.zip"
          notes="docs/releases/v0.3.0.md"
          # Never move a previously published tag to a different snapshot.
          if gh api "repos/$GH_REPO/git/ref/tags/v0.3.0" >/dev/null 2>&1; then
            tagged=$(gh api "repos/$GH_REPO/commits/v0.3.0" --jq .sha)
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo 'v0.3.0 already points to another snapshot. Publish a new version instead.'
              exit 1
            fi
          fi
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release edit v0.3.0 --title "KOTO Studio 0.3.0 Alpha" --prerelease --notes-file "$notes"
            gh release upload v0.3.0 "$archive" --clobber
          else
            gh release create v0.3.0 "$archive" --target "$GITHUB_SHA" --title "KOTO Studio 0.3.0 Alpha" --prerelease --notes-file "$notes"
          fi
          gh release view v0.3.0 --json url,tagName,isPrerelease,assets
