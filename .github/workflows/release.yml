name: Publish 0.2.5 alpha release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: koto-release-0.2.5
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package and verify the standalone source ZIP
        run: python scripts/package_release.py
      - name: Publish alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$(dirname "$GITHUB_WORKSPACE")/KOTO-Studio-v0.2.5.zip"
          notes="$RUNNER_TEMP/koto-release-notes.md"
          cat > "$notes" <<'NOTES'
          KOTO Studio 0.2.5 is an **alpha prerelease** of the local Windows/NVIDIA dubbing studio.

          Download **KOTO-Studio-v0.2.5.zip**, extract the whole folder, then run Install.cmd and Start.cmd. AI workers are selected through Install-Models.cmd. This package includes source and the built editor; runtimes and model weights download during setup.

          For an existing installation, close KOTO and copy the archive contents into the existing app folder. Preserve data/, runtime/, .venv/ and .workers/, then restart and refresh with Ctrl+F5.

          This baseline includes editable speaker timelines, mutes/visibility, source/reference voices, speaker-batched Piper/XTTS generation, autosave, keyboard deletion/undo, timing suggestions and reversible speed fitting. Export recommends timing fixes while allowing Render anyway and preserving full voice takes.

          The runtime baseline passed 37 backend tests and Windows Chromium installation/editing/export checks, plus real Piper and XTTS CPU batches: https://github.com/katfacey/koto-studio/actions/runs/38520342988

          Alpha limitations: no video inpainting, subtitle OCR, automatic lip sync, hosted inference or signed Windows executable. GPU inference and subjective voice matching still need target-machine evaluation. See README.md, CHANGELOG.md and VALIDATION.md in the archive.
          NOTES
          if gh release view v0.2.5 >/dev/null 2>&1; then
            gh release edit v0.2.5 --title "KOTO Studio 0.2.5 Alpha" --prerelease --notes-file "$notes"
            gh release upload v0.2.5 "$archive" --clobber
          else
            gh release create v0.2.5 "$archive" --target "$GITHUB_SHA" --title "KOTO Studio 0.2.5 Alpha" --prerelease --notes-file "$notes"
          fi
          gh release view v0.2.5 --json url,tagName,isPrerelease,assets
